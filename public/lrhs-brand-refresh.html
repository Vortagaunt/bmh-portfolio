<!DOCTYPE html>

<head>
<style>
@keyframes lrhs-page-fade-in { from { opacity: 0; } to { opacity: 1; } }
body { animation: lrhs-page-fade-in 600ms cubic-bezier(0.4, 0, 0.2, 1) both; }
</style>
<script>
document.addEventListener('click', function(e) {
  if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0) return;
  var a = e.target.closest && e.target.closest('a');
  if (!a) return;
  var href = a.getAttribute('href');
  if (!href) return;
  if (href.charAt(0) === '#') return;
  if (href.indexOf('://') !== -1) return;
  if (href.indexOf('mailto:') === 0 || href.indexOf('tel:') === 0) return;
  if (a.target === '_blank') return;
  e.preventDefault();
  document.body.style.transition = 'opacity 400ms cubic-bezier(0.4, 0, 0.2, 1)';
  document.body.style.opacity = '0';
  setTimeout(function() { window.location.href = href; }, 380);
});
</script>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

green. Gradients, hovers, depth */\n  --bright-pine:     #1C6E40;  /* Lifted green for interactive / charts     */\n  --spirit-red:      #AA2121;  /* Sparing accent (the \"I ♥ LR\" heart)       */\n  --ink:             #0B0B0B;  /* Near-black. Alt logo color, hard text     */\n  --white:           #FFFFFF;\n  --paper:           #FBFBF9;  /* Warm off-white page background            */\n\n  /* ---- NEUTRAL / STONE SCALE (warm gray, reads well beside green) ----- */\n  --stone-50:  #F6F7F6;\n  --stone-100: #ECEEEC;\n  --stone-200: #DCE0DD;\n  --stone-300: #C2C8C3;\n  --stone-400: #9AA29C;\n  --stone-500: #6E776F;\n  --stone-600: #515A53;\n  --stone-700: #3B423D;\n  --stone-800: #262B27;\n  --stone-900: #161917;\n\n  /* ---- SEMANTIC SURFACE / TEXT --------------------------------------- */\n  --bg:          var(--paper);\n  --bg-elevated: var(--white);\n  --bg-inverse:  var(--mustang-green);\n  --fg1:         var(--stone-900);   /* primary text            */\n  --fg2:         var(--stone-600);   /* secondary text          */\n  --fg3:         var(--stone-400);   /* muted / meta            */\n  --fg-on-green: #EAF1EC;            /* text on green surfaces   */\n  --fg-on-green-muted: #9FBCAB;\n  --line:        var(--stone-200);   /* hairline borders        */\n  --line-strong: var(--stone-300);\n  --focus:       #2E8F5B;            /* focus ring on light      */\n\n  --success: #1C6E40;\n  --warning: #B5751A;\n  --danger:  var(--spirit-red);\n\n  /* ---- TYPE FAMILIES -------------------------------------------------- */\n  --font-display: 'Industry', 'Saira Semi Condensed', 'Arial Narrow', system-ui, sans-serif; /* athletic jersey block */\n  --font-body:    'Hanken Grotesk', system-ui, -apple-system, sans-serif;\n  --font-script:  'Yellowtail', cursive;   /* spirit / retro accent only   */\n  --font-mono:    ui-monospace, 'SFMono-Regular', 'Roboto Mono', monospace;\n\n  /* ---- TYPE SCALE (fluid-ish, rem) ----------------------------------- */\n  --text-xs:   0.75rem t: var(--leading-tight);\n  letter-spacing: var(--tracking-display);\n  text-transform: uppercase;\n  color: var(--mustang-green);\n}\n\n.lr-h1 {\n  font-family: var(--font-display);\n  font-weight: 700;\n  font-size: var(--text-4xl);\n  line-height: var(--leading-tight);\n  text-transform: uppercase;\n  letter-spacing: var(--tracking-display);\n  color: var(--fg1);\n}\n\n.lr-h2 {\n  font-family: var(--font-display);\n  font-weight: 700;\n  font-size: var(--text-3xl);\n  line-height: var(--leading-snug);\n  text-transform: uppercase;\n  letter-spacing: 0;\n  color: var(--fg1);\n}\n\n.lr-h3 {\n  font-family: var(--font-display);\n  font-weight: 600;\n  font-size: var(--text-2xl);\n  line-height: var(--leading-snug);\n  color: var(--fg1);\n}\n\n.lr-h4 {\n  font-family: var(--font-body);\n  font-weight: 700;\n  font-size: var(--text-xl);\n  line-height: var(--leading-snug);\n  color: var(--fg1);\n}\n\n.lr-eyebrow {\n  font-family: var(--font-display);\n  font-weight: 600;\n  font-size: var(--text-sm);\n  text-transform: uppercase;\n  letter-spacing: var(--tracking-eyebrow);\n  color: var(--bright-pine);\n}\n\n.lr-lead {\n  font-family: var(--font-body);\n  font-weight: 400;\n  font-size: var(--text-xl);\n  line-height: var(--leading-body);\n  color: var(--fg2);\n}\n\n.lr-body {\n  font-family: var(--font-body);\n  font-weight: 400;\n  font-size: var(--text-base);\n  line-height: var(--leading-body);\n  color: var(--fg1);\n}\n\n.lr-small {\n  font-family: var(--font-body);\n  font-weight: 500;\n  font-size: var(--text-sm);\n  line-height: 1.45;\n  color: var(--fg2);\n}\n\n.lr-caption {\n  font-family: var(--font-body);\n  font-weight: 600;\n  font-size: var(--text-xs);\n  text-transform: uppercase;\n  letter-spacing: var(--tracking-wide);\n  color: var(--fg3);\n}\n\n.lr-script {\n  font-family: var(--font-script);\n  font-weight: 400;\n  color: var(--mustang-green);\n}\n\n/* Convenience color/surface utilities ------------------------------------ */\n.lr-on-green { colo 2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Space Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"4e9ebd4a-2cac-4cd8-baa7-b9da1f8aef6b\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  :root{\n    --bk:#080B09;        /* near-black, green-tinted */\n    --bk2:#0F140F;       /* panel */\n    --bk3:#161D17;       /* raised */\n    --hair:rgba(255,255,255,.12);\n    --hair2:rgba(255,255,255,.07);\n    --grn:#2EA866;       /* lifted green that reads on black */\n    --grn-deep:#033922;\n    --txt:#EAF1EC;\n    --txt2:#8FA396;\n    --mono:'Space Mono',ui-monospace,monospace;\n  }\n  *{box-sizing:border-box;}\n  html{scroll-behavior:smooth;}\n  body{margin:0;background:var(--bk);color:var(--txt);font-family:var(--font-body);-webkit-font-smoothing:antialiased;}\n  img{display:block;max-width:100%;}\n  ::selection{background:var(--grn);color:#000;}\n\n  .mono{font-family:var(--mono);text-transform:uppercase;letter-spacing:.14em;font-size:12px;}\n  .disp{font-family:var(--font-display);text-transform:uppercase;}\n  .wrap{max-width:1200px;margin:0 auto;padding:0 48px;}\n\n  /* top bar */\n  .bar{position:sticky;top:0;z-index:40;background:rgba(8,11,9,.78);backdrop-filter:blur(14px);border-bottom:1px solid var(--hair2);}\n  .bar .in{max-width:1200px;margin:0 auto;padding:16px 48px;display:flex;align-items:center;gap:18px;}\n  .bar .brand{display:flex;align-items:center;gap:11px;}\n  .bar .brand img{height:26px;}\n  .bar .brand .mono{color:var(--txt);font-weight:700;letter-spacing:.16em;}\n  .bar nav{margin-left:auto;display:flex;gap:24px;}\n  .bar nav a{font-family:var(--mono);text-transform:uppercase;font-size:11px;letter-spacing:.16em;color:var(--txt2);transition:color .2s;}\n  .bar nav a:hover{color:var(--grn);}\n  .bar nav .idx{color:var(--grn);}\n\n  /* hero */\n  .hero{position:relative;overflow:hidden;border-bottom:1px solid var(--hair);}\n  .hero .mk{position:absolute;right:-8%;top:50%;transform:translateY(-50%);height:150%;opacity:.05;filter:grayscale(1) brightness(3);}\n  .hero .in{position:relative;padding:120px 0 90px;}\n  .hero .tagrow{display:flex;gap:30px;color:var(--txt2);border-bottom:1px solid var(--hair2);padding-bottom:18px;margin-bottom:40px;flex-wrap:wrap;}\n  .hero .tagrow span b{color:var(--txt);}\n  .hero h1{font-family:var(--font-display);text-transform:uppercase;font-size:clamp(64px,11vw,150px);line-height:.86;letter-spacing:-.02em;margin:0;color:#fff;}\n  .hero h1 em{font-style:normal;color:var(--grn);}\n  .hero .lede{max-width:54ch;color:var(--txt2);font-size:19px;line-height:1.6;margin:34px 0 0;}\n  .hero .scroll{margin-top:50px;display:inline-flex;align-items:center;gap:10px;color:var(--grn);}\n\n  /* section scaffold */\n  section{border-bottom:1px solid var(--hair);}\n  .sec{padding:96px 0;}\n  .sechead{display:flex;align-items:baseline;gap:24px;border-top:1px solid var(--hair2);padding-top:22px;margin-bottom:48px;}\n  .sechead .no{font-family:var(--font-display);font-size:15px;color:var(--grn);letter-spacing:.1em;}\n  .sechead h2{font-family:var(--font-display);text-transform:uppercase;font-size:clamp(34px,4.4vw,60px);line-height:.96;letter-spacing:-.01em;margin:0;color:#fff;}\n  .sechead .lede{margin-left:auto;max-width:40ch;color:var(--txt2);font-size:15px;line-height:1.6;}\n\n  /* identity pillars */\n  .pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--hair2);}\n  .pillars .p{padding:34px;border-right:1px solid var(--hair2);}\n  .pillars .p:last-child{border-right:none;}\n  .pillars .p .n{font-family:var(--mono);color:var(--grn);font-size:12px;letter-spacing:.14em;}\n  .pillars .p h3{font-family:var(--font-display);text-transform:uppercase;font-size:32px;margin:18px 0 10px;color:#fff;letter-spacing:-.01em;}\n  .pillars .p p{color:var(--txt2);font-size:14px;line-height:1.6;margin:0;}\n\n  /* logos */\n  .logos{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--hair2);border:1px solid var(--hair2);}\n  .lg{background:var(--bk);padding:0;}\n  .lg .stage{height:230px;display:flex;align-items:center;justify-content:center;padding:34px;}\n  .lg.lite .stage{background:#fff;}\n  .lg.grn .stage{background:var(--grn-deep);}\n  .lg .stage img{max-height:150px;max-width:86%;}\n  .lg .foot{display:flex;justify-content:space-between;align-items:baseline;padding:16px 22px;border-top:1px solid var(--hair2);gap:12px;}\n  .lg .foot .nm{font-family:var(--font-display);text-transform:uppercase;font-size:14px;letter-spacing:.04em;color:#fff;}\n  .lg .foot .mono{color:var(--txt2);}\n\n  /* color */\n  .cols{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--hair2);border:1px solid var(--hair2);}\n  .col{padding:0;background:var(--bk);}\n  .col .chip{height:150px;}\n  .col .meta{padding:18px 20px;}\n  .col .meta .nm{font-family:var(--font-display);text-transform:uppercase;font-size:16px;color:#fff;letter-spacing:.03em;}\n  .col .meta .hx{font-family:var(--mono);color:var(--grn);font-size:13px;margin-top:7px;}\n  .col .meta .u{color:var(--txt2);font-size:12.5px;margin-top:9px;line-height:1.45;}\n  .stoneband{display:flex;margin-top:1px;border:1px solid var(--hair2);border-top:none;}\n  .stoneband div{flex:1;height:54px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;font-family:var(--mono);font-size:10px;}\n\n  /* type */\n  .typeblock{border:1px solid var(--hair2);padding:40px;margin-bottom:1px;}\n  .typeblock .top{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--hair2);padding-bottom:16px;margin-bottom:26px;flex-wrap:wrap;gap:8px;}\n  .typeblock .top .nm{font-family:var(--font-display);text-transform:uppercase;font-size:20px;letter-spacing:.03em;color:#fff;}\n  .typeblock .top .mono{color:var(--txt2);}\n  .specimen{font-family:var(--font-display);text-transform:uppercase;color:#fff;font-size:clamp(56px,9vw,120px);line-height:.9;letter-spacing:.01em;}\n  .specimen em{font-style:normal;color:var(--grn);}\n  .charset{font-family:var(--font-display);text-transform:uppercase;color:var(--txt2);font-size:24px;letter-spacing:.18em;margin-top:24px;line-height:1.5;}\n  .typegrid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--hair2);}\n  .bodyspec{font-family:var(--font-body);font-size:64px;font-weight:700;color:#fff;line-height:1;}\n  .scaleline{display:flex;align-items:baseline;gap:20px;padding:12px 0;border-bottom:1px solid var(--hair2);}\n  .scaleline:last-child{border:none;}\n  .scaleline .k{font-family:var(--mono);font-size:11px;color:var(--txt2);width:96px;flex:none;}\n\n  /* icons */\n  .iconwrap{display:grid;grid-template-columns:repeat(8,1fr);gap:1px;background:var(--hair2);border:1px solid var(--hair2);}\n  .iconwrap .ic{background:var(--bk);height:96px;display:flex;align-items:center;justify-content:center;color:var(--grn);}\n\n  /* voice */\n  .voicegrid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--hair2);border:1px solid var(--hair2);margin-bottom:30px;}\n  .vc{background:var(--bk);padding:30px 32px;}\n  .vc h4{font-family:var(--font-display);text-transform:uppercase;font-size:16px;color:var(--grn);margin:0 0 16px;letter-spacing:.04em;}\n  .vc ul{margin:0;padding-left:18px;color:var(--txt2);font-size:14px;line-height:1.85;}\n  .vc ul em{color:var(--txt);font-style:normal;}\n  .cries{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;}\n  .cry{font-family:var(--font-display);text-transform:uppercase;font-size:13px;letter-spacing:.04em;padding:9px 16px;border:1px solid var(--hair);border-radius:999px;color:var(--txt);}\n  .cry:hover{border-color:var(--grn);color:var(--grn);}\n\n  /* CTA doorway to website */\n  .door{background:linear-gradient(160deg,#0A4A2B,var(--grn-deep) 60%,#021C11);position:relative;overflow:hidden;border-bottom:none;}\n  .door .mk{position:absolute;left:-6%;bottom:-30%;height:170%;opacity:.08;}\n  .door .in{position:relative;padding:110px 0;text-align:center;}\n  .door .mono{color:#84C9A2;}\n  .door h2{font-family:var(--font-display);text-transform:uppercase;font-size:clamp(44px,7vw,92px);line-height:.92;letter-spacing:-.015em;color:#fff;margin:18px 0 0;}\n  .door p{color:var(--fg-on-green,#cfe6d8);max-width:46ch;margin:22px auto 0;font-size:18px;line-height:1.6;}\n  .launch{display:inline-flex;align-items:center;gap:16px;margin-top:42px;background:#fff;color:var(--grn-deep);font-family:var(--font-display);text-transform:uppercase;letter-spacing:.03em;font-size:20px;padding:20px 34px;border-radius:10px;transition:transform .2s,box-shadow .2s;box-shadow:0 18px 50px rgba(0,0,0,.4);}\n  .launch:hover{transform:translateY(-3px);box-shadow:0 24px 60px rgba(0,0,0,.5);}\n  .launch .arr{display:inline-flex;width:34px;height:34px;border-radius:50%;background:var(--grn-deep);color:#fff;align-items:center;justify-content:center;font-size:18px;transition:transform .2s;}\n  .launch:hover .arr{transform:translateX(4px);}\n  .door small{display:block;margin-top:20px;font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:#6FA588;}\n\n  footer{background:var(--bk);padding:34px 0;}\n  footer .in{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;}\n  footer img{height:30px;opacity:.7;}\n  footer .mono{color:var(--txt2);}\n\n  @media(max-width:820px){\n    .wrap,.bar .in{padding-left:24px;padding-right:24px;}\n    .bar nav{display:none;}\n    .pillars,.logos,.cols,.typegrid,.voicegrid{grid-template-columns:1fr;}\n    .iconwrap{grid-template-columns:repeat(4,1fr);}\n    .sechead{flex-wrap:wrap;}\n    .sechead .lede{margin-left:0;flex-basis:100%;}\n  }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n\n<div class=\"bar\">\n  <div class=\"in\">\n    <div class=\"brand\"><img src=\"8ed97ae0-db2e-4a62-ac96-64a6bce9d7d1\" alt=\"\"><span class=\"mono\">LRHS / Brand System<\u002Fspan><\u002Fdiv>\n    <nav>\n      <a href=\"#identity\"><span class=\"idx\">01<\u002Fspan> Identity<\u002Fa>\n      <a href=\"#logos\"><span class=\"idx\">02<\u002Fspan> Logos<\u002Fa>\n      <a href=\"#color\"><span class=\"idx\">03<\u002Fspan> Color<\u002Fa>\n      <a href=\"#type\"><span class=\"idx\">04<\u002Fspan> Type<\u002Fa>\n      <a href=\"#voice\"><span class=\"idx\">05<\u002Fspan> Voice<\u002Fa>\n      <a href=\"#live\" style=\"color:var(--grn)\">→ Live Site<\u002Fa>\n    <\u002Fnav>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- HERO -->\n<section class=\"hero\">\n  <img class=\"mk\" src=\"8ed97ae0-db2e-4a62-ac96-64a6bce9d7d1\" alt=\"\">\n  <div class=\"wrap in\">\n    <div class=\"tagrow mono\">\n      <span>Lakewood Ranch High School<\u002Fspan>\n      <span>Est. <b>1998<\u002Fb><\u002Fspan>\n      <span>Mascot <b>Mustangs<\u002Fb><\u002Fspan>\n      <span>Rev. <b>2026<\u002Fb><\u002Fspan>\n    <\u002Fdiv>\n    <h1>The Mustang<br><em>Brand<\u002Fem> System<\u002Fh1>\n    <p class=\"lede\">The complete visual language behind the green and white — marks, color, type, and voice. One source of truth, built so every Mustang touchpoint looks unmistakably like us.<\u002Fp>\n    <a class=\"scroll mono\" href=\"#identity\">↓ Begin — 01 Identity<\u002Fa>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 01 IDENTITY -->\n<section id=\"identity\"><div class=\"wrap sec\">\n  <div class=\"sechead\"><span class=\"no\">01<\u002Fspan><h2>Identity<\u002Fh2>\n    <p class=\"lede\">Proud, athletic heritage — modernized. Built on one confident green, a fierce mustang, and bold collegiate lettering.<\u002Fp>\n  <\u002Fdiv>\n  <div class=\"pillars\">\n    <div class=\"p\"><div class=\"n\">/ 01<\u002Fdiv><h3>Proud<\u002Fh3><p>We celebrate our scholars, athletes, and artists loudly and often. Game-day energy, all year.<\u002Fp><\u002Fdiv>\n    <div class=\"p\"><div class=\"n\">/ 02<\u002Fdiv><h3>Grounded<\u002Fh3><p>Welcoming and clear for every family. Spirited, never corporate; confident, never loud for its own sake.<\u002Fp><\u002Fdiv>\n    <div class=\"p\"><div class=\"n\">/ 03<\u002Fdiv><h3>Together<\u002Fh3><p>One campus, one community. We ride together — and the brand always pulls in the same direction.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv><\u002Fsection>\n\n<!-- 02 LOGOS -->\n<section id=\"logos\"><div class=\"wrap sec\">\n  <div class=\"sechead\"><span class=\"no\">02<\u002Fspan><h2>The Marks<\u002Fh2>\n    <p class=\"lede\">Five marks for every situation. Always use supplied artwork — never redraw, recolor, or stretch the mascot.<\u002Fp>\n  <\u002Fdiv>\n  <div class=\"logos\">\n    <div class=\"lg lite\"><div class=\"stage\"><img src=\"fff3781b-826f-4784-bd58-cb9b611715e0\"><\u002Fdiv><div class=\"foot\"><span class=\"nm\">Primary Lockup<\u002Fspan><span class=\"mono\">Official<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <div class=\"lg lite\"><div class=\"stage\"><img src=\"4796dda4-9e8b-4b34-83f4-16c8a7d1c2d7\"><\u002Fdiv><div class=\"foot\"><span class=\"nm\">LR Emblem<\u002Fspan><span class=\"mono\">Athletics<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <div class=\"lg grn\"><div class=\"stage\"><img src=\"bcdac385-4bb6-4edf-9c69-cffb8912209f\"><\u002Fdiv><div class=\"foot\"><span class=\"nm\">Reverse Lockup<\u002Fspan><span class=\"mono\">On Green<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <div class=\"lg grn\"><div class=\"stage\"><img src=\"8ed97ae0-db2e-4a62-ac96-64a6bce9d7d1\"><\u002Fdiv><div class=\"foot\"><span class=\"nm\">Mustang Mark<\u002Fspan><span class=\"mono\">Icon / WM<\u002Fspan><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv><\u002Fsection>\n\n<!-- 03 COLOR -->\n<section id=\"color\"><div class=\"wrap sec\">\n  <div class=\"sechead\"><span class=\"no\">03<\u002Fspan><h2>Color<\u002Fh2>\n    <p class=\"lede\">Mustang Green leads, partnered with black and white. Spirit Red is the only accent — and it stays rare.<\u002Fp>\n  <\u002Fdiv>\n  <div class=\"cols\">\n    <div class=\"col\"><div class=\"chip\" style=\"background:#033922\"><\u002Fdiv><div class=\"meta\"><div class=\"nm\">Mustang Green<\u002Fdiv><div class=\"hx\">#033922<\u002Fdiv><div class=\"u\">Primary — logos, fills, headers.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"col\"><div class=\"chip\" style=\"background:#144B2C\"><\u002Fdiv><div class=\"meta\"><div class=\"nm\">Field Green<\u002Fdiv><div class=\"hx\">#144B2C<\u002Fdiv><div class=\"u\">Secondary — depth &amp; gradients.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"col\"><div class=\"chip\" style=\"background:#1C6E40\"><\u002Fdiv><div class=\"meta\"><div class=\"nm\">Bright Pine<\u002Fdiv><div class=\"hx\">#1C6E40<\u002Fdiv><div class=\"u\">Interactive accents &amp; data.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"col\"><div class=\"chip\" style=\"background:#AA2121\"><\u002Fdiv><div class=\"meta\"><div class=\"nm\">Spirit Red<\u002Fdiv><div class=\"hx\">#AA2121<\u002Fdiv><div class=\"u\">Sparing accent — the ♥.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"col\"><div class=\"chip\" style=\"background:#0B0B0B;outline:1px solid var(--hair2);outline-offset:-1px\"><\u002Fdiv><div class=\"meta\"><div class=\"nm\">Ink<\u002Fdiv><div class=\"hx\">#0B0B0B<\u002Fdiv><div class=\"u\">Hard contrast, alt mark.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"col\"><div class=\"chip\" style=\"background:#FBFBF9\"><\u002Fdiv><div class=\"meta\"><div class=\"nm\">Paper<\u002Fdiv><div class=\"hx\">#FBFBF9<\u002Fdiv><div class=\"u\">Warm off-white background.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"stoneband\">\n    <div style=\"background:#F6F7F6;color:#515A53\">50<\u002Fdiv><div style=\"background:#ECEEEC;color:#515A53\">100<\u002Fdiv>\n    <div style=\"background:#DCE0DD;color:#3B423D\">200<\u002Fdiv><div style=\"background:#C2C8C3;color:#262B27\">300<\u002Fdiv>\n    <div style=\"background:#9AA29C;color:#161917\">400<\u002Fdiv><div style=\"background:#6E776F;color:#fff\">500<\u002Fdiv>\n    <div style=\"background:#515A53;color:#fff\">600<\u002Fdiv><div style=\"background:#3B423D;color:#fff\">700<\u002Fdiv>\n    <div style=\"background:#262B27;color:#fff\">800<\u002Fdiv><div style=\"background:#161917;color:#fff\">900<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv><\u002Fsection>\n\n<!-- 04 TYPE -->\n<section id=\"type\"><div class=\"wrap sec\">\n  <div class=\"sechead\"><span class=\"no\">04<\u002Fspan><h2>Type<\u002Fh2>\n    <p class=\"lede\">Industry Black for every headline — uppercase, tracked, athletic. Hanken Grotesk for body.<\u002Fp>\n  <\u002Fdiv>\n  <div class=\"typeblock\">\n    <div class=\"top\"><span class=\"nm\">Display — Industry Black<\u002Fspan><span class=\"mono\">--font-display · uppercase<\u002Fspan><\u002Fdiv>\n    <div class=\"specimen\">Go <em>Mustangs<\u002Fem><\u002Fdiv>\n    <div class=\"charset\">ABCDEFGHIJKLMNOPQRSTUVWXYZ · 0123456789<\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"typegrid\">\n    <div class=\"typeblock\" style=\"margin:0;border-right:none;\">\n      <div class=\"top\"><span class=\"nm\">Body — Hanken Grotesk<\u002Fspan><span class=\"mono\">--font-body<\u002Fspan><\u002Fdiv>\n      <div class=\"bodyspec\">Aa<\u002Fdiv>\n      <p style=\"color:var(--txt2);font-size:15px;line-height:1.65;margin:20px 0 0;\">From Friday-night lights to the science fair, there's a place for every Mustang to compete, create, and belong.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"typeblock\" style=\"margin:0;\">\n      <div class=\"top\"><span class=\"nm\">Scale<\u002Fspan><span class=\"mono\">semantic ramp<\u002Fspan><\u002Fdiv>\n      <div class=\"scaleline\"><span class=\"k\">display<\u002Fspan><span class=\"disp\" style=\"font-size:30px;color:var(--grn)\">Ride Together<\u002Fspan><\u002Fdiv>\n      <div class=\"scaleline\"><span class=\"k\">heading<\u002Fspan><span class=\"disp\" style=\"font-size:22px;color:#fff\">Mustang News<\u002Fspan><\u002Fdiv>\n      <div class=\"scaleline\"><span class=\"k\">eyebrow<\u002Fspan><span class=\"disp\" style=\"font-size:12px;letter-spacing:.18em;color:var(--grn)\">One Ranch<\u002Fspan><\u002Fdiv>\n      <div class=\"scaleline\"><span class=\"k\">body<\u002Fspan><span style=\"font-size:15px;color:var(--txt2)\">Sentence-case body.<\u002Fspan><\u002Fdiv>\n      <div class=\"scaleline\"><span class=\"k\">caption<\u002Fspan><span class=\"mono\" style=\"color:var(--txt2)\">7:00 PM · Stadium<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top:30px;display:grid;grid-template-columns:repeat(8,1fr);gap:1px;background:var(--hair2);border:1px solid var(--hair2);\" id=\"iconwrap\"><\u002Fdiv>\n  <p class=\"mono\" style=\"color:var(--txt2);margin-top:16px;\">Iconography — Lucide outline set, ~2px stroke, currentColor. No emoji in official use.<\u002Fp>\n<\u002Fdiv><\u002Fsection>\n\n<!-- 05 VOICE -->\n<section id=\"voice\"><div class=\"wrap sec\">\n  <div class=\"sechead\"><span class=\"no\">05<\u002Fspan><h2>Voice<\u002Fh2>\n    <p class=\"lede\">We speak as <em>we<\u002Fem>, to <em>you<\u002Fem>. Headlines shout in caps; body stays warm and plain.<\u002Fp>\n  <\u002Fdiv>\n  <div class=\"voicegrid\">\n    <div class=\"vc\"><h4>We Do<\u002Fh4><ul>\n      <li>Speak as <em>we<\u002Fem>; address the reader as <em>you<\u002Fem>.<\u002Fli>\n      <li>Headlines &amp; labels UPPERCASE; body sentence case.<\u002Fli>\n      <li>Lead with pride and clarity.<\u002Fli>\n      <li>Use rallying cries sparingly.<\u002Fli>\n    <\u002Ful><\u002Fdiv>\n    <div class=\"vc\"><h4>We Don't<\u002Fh4><ul>\n      <li>No corporate jargon or buzzwords.<\u002Fli>\n      <li>No emoji in flagship materials.<\u002Fli>\n      <li>No trailing periods on headlines.<\u002Fli>\n      <li>Never snarky or talking down.<\u002Fli>\n    <\u002Ful><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"cries\">\n    <span class=\"cry\">Go Mustangs<\u002Fspan><span class=\"cry\">Home of the Mustangs<\u002Fspan><span class=\"cry\">Ride Together<\u002Fspan>\n    <span class=\"cry\">Mustang Pride<\u002Fspan><span class=\"cry\">One Ranch<\u002Fspan><span class=\"cry\">Join the Herd<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fdiv><\u002Fsection>\n\n<!-- DOORWAY TO WEBSITE -->\n<section id=\"live\" class=\"door\">\n  <img class=\"mk\" src=\"8ed97ae0-db2e-4a62-ac96-64a6bce9d7d1\" alt=\"\">\n  <div class=\"wrap in\">\n    <div class=\"mono\">06 — The System, Applied<\u002Fdiv>\n    <h2>See It Come<br>To Life<\u002Fh2>\n    <p>Everything above, built into a living product. Step into the Lakewood Ranch High School website — an interactive, on-brand mockup.<\u002Fp>\n    <a class=\"launch\" href=\"/lrhs-brand-system/website-concept.html\">Launch Website Mockup <span class=\"arr\">→<\u002Fspan><\u002Fa>\n    <small>Opens the LRHS Website UI kit · a separate experience<\u002Fsmall>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<footer><div class=\"wrap in\">\n  <img src=\"bcdac385-4bb6-4edf-9c69-cffb8912209f\" alt=\"LRHS\">\n  <span class=\"mono\">© 2026 Lakewood Ranch High School · Brand System · Go Mustangs<\u002Fspan>\n<\u002Fdiv><\u002Ffooter>\n\n<script src=\"e83fa083-b533-4c29-b6a8-dd94634fdb02\"><\u002Fscript>\n<script>\n  const names=['graduation-cap','trophy','calendar','users','map-pin','megaphone','book-open','star','ticket','bell','heart','shield','flag','music','flask-conical','award'];\n  const wrap=document.getElementById('iconwrap');\n  names.forEach(n=>{const d=document.createElement('div');d.className='ic';d.style.cssText='background:var(--bk);height:88px;display:flex;align-items:center;justify-content:center;color:var(--grn);';const i=document.createElement('i');i.setAttribute('data-lucide',n);d.appendChild(i);wrap.appendChild(d);});\n  if(window.lucide) lucide.createIcons({attrs:{width:26,height:26}});\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
